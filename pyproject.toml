[project]
name = "milloclips"
version = "0.1.0"
description = "Cheap, iterative AI editing pipeline for League of Legends VODs"
requires-python = ">=3.12"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
  "openai>=2.0.0",
  "pillow>=11",
  "python-dotenv>=1.0.0",
  "yt-dlp>=2025.9.5",
]

[project.scripts]
milloclips = "milloclips.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["milloclips"]
